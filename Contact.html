/* ---- MOBILE MENU DRAWER STYLES ---- */
.mobile-menu-toggle {
  display: none;
  background: transparent;
  border: none;
  color: white;
  font-size: 1.8em;
  cursor: pointer;
  z-index: 10;
  padding: 5px 10px;
}

.mobile-menu-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: rgba(0, 0, 0, 0.7);
  backdrop-filter: blur(5px);
  z-index: 999;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.3s ease, visibility 0.3s ease;
}

.mobile-menu-overlay.active {
  opacity: 1;
  visibility: visible;
}

.mobile-menu-drawer {
  position: fixed;
  top: 0;
  right: -300px;
  width: 280px;
  height: 100vh;
  background: #141414;
  border-left: 1px solid rgba(255, 255, 255, 0.1);
  z-index: 1000;
  transition: right 0.3s ease;
  display: flex;
  flex-direction: column;
  padding: 25px 20px;
  box-shadow: -5px 0 25px rgba(0, 0, 0, 0.8);
}

.mobile-menu-drawer.active {
  right: 0;
}

.drawer-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 30px;
  padding-bottom: 15px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}

.drawer-logo {
  font-family: 'Great Vibes', cursive;
  font-size: 2em;
  color: #fff;
}

.drawer-close {
  background: none;
  border: none;
  color: #fff;
  font-size: 2em;
  cursor: pointer;
  transition: color 0.2s;
}

.drawer-close:hover {
  color: #c800ff;
}

.drawer-links {
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.drawer-link {
  color: #ddd;
  text-decoration: none;
  font-size: 1.1em;
  padding: 12px 15px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  gap: 12px;
  transition: all 0.2s ease;
}

.drawer-link:hover, .drawer-link.active {
  background: rgba(200, 0, 255, 0.2);
  color: #fff;
  border-left: 4px solid #c800ff;
}

.drawer-btn {
  margin-top: 20px;
  background: linear-gradient(100deg, #bfabab, #9405bc);
  justify-content: center;
  font-weight: bold;
}

@media (max-width: 768px) {
  .nav-links {
    display: none !important;
  }

  .mobile-menu-toggle {
    display: block;
  }

  .logo-text {
    display: none;
  }

  .logo-image {
    display: inline;
  }

  .monster {
    top: 0;
    right: 50px;
  }

  .monster-image {
    width: 80px;
    height: auto;
  }
}

position: fixed;
top: 0;

    .status-popup {

<!-- Mobile Navigation Drawer -->
<div class="mobile-menu-overlay" id="mobileMenuOverlay"></div>
<div class="mobile-menu-drawer" id="mobileMenuDrawer">
  <div class="drawer-header">
    <div class="drawer-logo">Animora</div>
    <button class="drawer-close" id="drawerClose" aria-label="Close Menu">&times;</button>

  <div class="drawer-links">

<script>
  (function() {
    const toggleBtn = document.getElementById('mobileMenuToggle');
    const closeBtn = document.getElementById('drawerClose');
    const drawer = document.getElementById('mobileMenuDrawer');
    const overlay = document.getElementById('mobileMenuOverlay');

    function openDrawer() {
      drawer.classList.add('active');
      overlay.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeDrawer() {
      drawer.classList.remove('active');
      overlay.classList.remove('active');
      document.body.style.overflow = '';
    }

    if (toggleBtn) toggleBtn.addEventListener('click', openDrawer);
    if (closeBtn) closeBtn.addEventListener('click', closeDrawer);
    if (overlay) overlay.addEventListener('click', closeDrawer);
  })();
</script>

  

  <!-- SUGURU CHARACTER -->
  <div class="suguru-character">
    <img src="images/suguru.png" alt="Suguru" />
  </div>

  <!-- CONTACT SECTION -->
  <div class="main-container">
    <div class="contact-section">
      <div class="sword-decoration">
        <div class="red-circle"></div>
        <img src="images/sword.png" alt="Sword" />
      </div>

      <div class="contact-form">
        <h2>Contact Us</h2>
        <form id="contactForm">
          <div class="form-group">
            <input type="text" name="name" placeholder="Full Name" required />
          </div>
          <div class="form-group">
            <input type="email" name="email" placeholder="Email" required />
          </div>
          <div class="form-group">
            <textarea name="message" placeholder="Message" required></textarea>
          </div>
          <button type="submit" class="submit-btn">Contact Us</button>
        </form>
        
      </div>
    </div>
  </div>
  <script>
    const form = document.getElementById("contactForm");
    const statusPopup = document.getElementById("statusPopup");
    let hideTimeout;
  
    form.addEventListener("submit", async function (e) {
      e.preventDefault();
  
      const formData = new FormData(form);
  
      try {
        const response = await fetch("https://formspree.io/f/mldnaagv", {
          method: "POST",
          body: formData,
          headers: {
            Accept: "application/json",
          },
        });
  
        if (response.ok) {
          statusPopup.classList.add("show");
          clearTimeout(hideTimeout);
          hideTimeout = setTimeout(() => {
            statusPopup.classList.remove("show");
          }, 1500);
          form.reset();
        } else {
          alert("Failed to submit. Please try again.");
        }
      } catch (err) {
        alert("Error submitting form. Please try again.");
      }
    });
  
    statusPopup.addEventListener("click", () => {
      clearTimeout(hideTimeout);
      statusPopup.classList.remove("show");
    });
  </script>
