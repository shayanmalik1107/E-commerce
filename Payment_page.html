<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animora Payment</title>
    <link rel="icon" href="images/nicee.png" type="image/png">

    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&display=swap" rel="stylesheet" />

    <style>
      body {
        background-image: url("images/text.png");
        background-color: #333;
        background-size: cover;
        background-position: center;
        margin: 0;
        font-family: "Georgia", serif;
        color: white;
        position: relative;
        overflow-x: hidden;
        transition: all 0.3s ease;
      }

      .container {
        position: relative;
        z-index: 1;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0px 40px;
        background-color: #1a1a1a;
      }

      .logo {
        font-family: "Brush Script MT", cursive;
        font-size: 36px; /* Increased font size */
        color: white;
      }

      .face-icon {
        margin-top: 30px;
        height: 90px;
        width: auto;
        transform: scale(1.5); /* Scales the image visually */
        transform-origin: center;
      }

      .card {
        margin: 100px auto 20px;
        display: flex;
        justify-content: center;
        background-color: #111;
        border-radius: 8px;
        width: 80%;
        max-width: 900px;
        padding: 40px;
        z-index: 2;
        position: relative;
      }

      .shirt-preview {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        border-radius: 20px;
        padding: 20px;
      }

      .shirt-preview img {
        max-width: 100%;
        max-height: 350px;
      }

      .payment-section {
        flex: 2;
        margin-left: 40px;
      }

      .payment-section h2 {
        font-size: 26px;
        margin-bottom: 20px;
        font-family: 'Instrument Serif', serif;
      }

      .payment-icons {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
      }

      .payment-icons img {
        height: 35px;
        width: 55px;
        object-fit: contain;
        background-color: white;
        padding: 2px;
        border-radius: 4px;
        cursor: pointer;
        transition: all 0.3s ease;
        border: 2px solid transparent;
      }

      .payment-icons img:hover {
        transform: scale(1.05);
        border-color: #00ff00;
        box-shadow: 0 0 10px rgba(0, 255, 0, 0.3);
      }

      .payment-icons img.selected {
        border-color: #00ff00;
        box-shadow: 0 0 15px rgba(0, 255, 0, 0.5);
      }

      .input-group {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 20px;
      }

      .input-group input {
  background-color: transparent;
  border: none;
  border-bottom: 1px solid white;
  color: white;
  padding: 5px 10px;
  width: 40%;
  outline: none;
  box-shadow: none;
  transition: all 0.3s ease;
  position: relative;
}

.input-group input:focus {
  border-bottom: 2px solid #00ff00;
  transform: scale(1.02);
}

.input-group input.valid {
  border-bottom-color: #00ff00;
}

.input-group input.invalid {
  border-bottom-color: #ff4444;
}

.input-validation {
  font-size: 12px;
  margin-top: 5px;
  opacity: 0;
  transition: opacity 0.3s ease;
}

.input-validation.show {
  opacity: 1;
}

.input-validation.success {
  color: #00ff00;
}

.input-validation.error {
  color: #ff4444;
}


      .input-group span {
        font-style: italic;
        opacity: 0.6;
      }

      .cash-toggle {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 0;
      }

      .switch {
        width: 50px;
        height: 25px;
        background: #444;
        border-radius: 20px;
        display: inline-block;
        position: relative;
        cursor: pointer;
      }

      .switch::before {
        content: "";
        position: absolute;
        width: 20px;
        height: 20px;
        background: #999;
        border-radius: 50%;
        top: 2.5px;
        left: 2.5px;
        transition: 0.3s;
      }

      input[type="checkbox"]:checked + .switch::before {
        transform: translateX(25px);
        background: #00ff00;
      }
/* Hide number input arrows in most modern browsers */
input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button {
  -webkit-appearance: none;
  margin: 0;
}

/* For Firefox */
input[type="number"] {
  -moz-appearance: textfield;
}

      .confirm-btn {
        display: block;
        margin: 30px auto 80px;
        padding: 12px 30px;
        border: none;
        background: white;
        color: black;
        border-radius: 30px;
        cursor: pointer;
        font-weight: bold;
        font-size: 16px;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
      }

      .confirm-btn:hover:not(:disabled) {
        background: #00ff00;
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(0, 255, 0, 0.3);
      }

      .confirm-btn.loading {
        pointer-events: none;
      }

      .confirm-btn.loading::after {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        width: 20px;
        height: 20px;
        margin: -10px;
        border: 2px solid transparent;
        border-top: 2px solid #333;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      .security-info {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 20px;
        padding: 10px;
        background: rgba(0, 255, 0, 0.1);
        border-radius: 5px;
        border-left: 3px solid #00ff00;
      }

      .security-icon {
        font-size: 18px;
        color: #00ff00;
      }
      input:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}
.confirm-btn:disabled {
  cursor: not-allowed;
  pointer-events: none;
  opacity: 0.5;
}

@media screen and (max-width: 768px) {
  .card {
    flex-direction: column;
    padding: 20px;
  }

  .payment-section {
    margin-left: 0;
    text-align: center;
  }

  .payment-section h2 {
    font-size: 22px;
  }

  .payment-icons {
    justify-content: center;
    flex-wrap: wrap;
  }

  .payment-icons img {
    height: 30px;
    width: 45px;
  }

  .input-group {
    flex-direction: column;
    gap: 8px;
    align-items: center;
  }

  .input-group input {
    width: 80%;
  }

  .cash-toggle {
    justify-content: center;
    margin-top: 10px;
  }

  .confirm-btn {
    margin-top: 30px;
    font-size: 14px;
    padding: 10px 24px;
  }

  .shirt-preview img {
    max-height: 200px;
  }

  .face-icon {
    height: 60px;
    margin-top: 10px;
    transform: scale(1.2);
  }

  .logo {
    font-size: 28px;
  }
  .input-group span {
    position: relative;
    top: 6px;
  }
}

    </style>
  </head>

  <body>
    <div class="container">
      <header>
        <h1 class="logo"><a href="Animora.html" style="color: aliceblue;">Animora</a></h1>
        <img src="images/monster.png" alt="Face Icon" class="face-icon" />
      </header>

      <main class="card">
        <div class="shirt-preview">
          <img src="images/shirt2.png" alt="Shirt" />
        </div>

        <div class="payment-section">
          <h2>Payment Methods</h2>
          <div class="payment-icons">
            <img src="images/Mastercard.png" alt="Mastercard" />
            <img src="images/unionPay.png" alt="UnionPay" />
            <img src="images/PayPal.png" alt="PayPal" />
            <img src="images/jazzcash.png" alt="JazzCash" />
            <img src="images/easypaisa.png" alt="Easypaisa" />
          </div>

          <div class="input-group">
            <div style="flex: 1;">
              <input type="text" placeholder="Account No." id="account" />
              <div class="input-validation" id="account-validation"></div>
            </div>
            <span>Or</span>
            <div style="flex: 1;">
              <input type="text" placeholder="IBAN" id="iban" />
              <div class="input-validation" id="iban-validation"></div>
            </div>
          </div>

          <div class="cash-toggle">
            <label for="cod">Cash On Delivery</label>
            <input type="checkbox" id="cod" style="display: none" />
            <label class="switch" for="cod"></label>
          </div>

          <div class="security-info">
            <span class="security-icon">🔒</span>
            <small>Your payment information is encrypted and secure</small>
          </div>
        </div>
      </main>

      <button class="confirm-btn" disabled onclick="window.location.href='Invoice.html'">Confirm Order</button>
    </div>
    <script>
     const accountInput = document.getElementById("account");
const ibanInput = document.getElementById("iban");
const codCheckbox = document.getElementById("cod");
const confirmBtn = document.querySelector(".confirm-btn");
const accountValidation = document.getElementById("account-validation");
const ibanValidation = document.getElementById("iban-validation");
const paymentIcons = document.querySelectorAll(".payment-icons img");

let selectedPaymentMethod = null;

// Payment method selection
paymentIcons.forEach(icon => {
  icon.addEventListener('click', () => {
    // Remove selection from all icons
    paymentIcons.forEach(i => i.classList.remove('selected'));
    // Add selection to clicked icon
    icon.classList.add('selected');
    selectedPaymentMethod = icon.alt;
    validateForm();
  });
});

function handleAccountInput(input, maxLength) {
  input.value = input.value.replace(/\D/g, "").slice(0, maxLength);
}

function handleIbanInput(input, maxLength) {
  input.value = input.value.replace(/[^a-zA-Z0-9]/g, "").slice(0, maxLength);
}

function showValidation(element, message, isValid) {
  const validation = element.nextElementSibling;
  validation.textContent = message;
  validation.className = `input-validation show ${isValid ? 'success' : 'error'}`;
  element.className = element.className.replace(/\b(valid|invalid)\b/g, '') + ` ${isValid ? 'valid' : 'invalid'}`;
}

function hideValidation(element) {
  const validation = element.nextElementSibling;
  validation.className = 'input-validation';
  element.className = element.className.replace(/\b(valid|invalid)\b/g, '');
}

accountInput.addEventListener("input", () => {
  handleAccountInput(accountInput, 16);
  
  if (accountInput.value.trim() !== "") {
    ibanInput.disabled = true;
    hideValidation(ibanInput);
    
    if (accountInput.value.length < 12) {
      showValidation(accountInput, "Account number should be 12-16 digits", false);
    } else if (accountInput.value.length >= 12 && accountInput.value.length <= 16) {
      showValidation(accountInput, "✓ Valid account number", true);
    }
  } else {
    ibanInput.disabled = codCheckbox.checked ? true : false;
    hideValidation(accountInput);
  }
  validateForm();
});

ibanInput.addEventListener("input", () => {
  handleIbanInput(ibanInput, 24);
  
  if (ibanInput.value.trim() !== "") {
    accountInput.disabled = true;
    hideValidation(accountInput);
    
    if (ibanInput.value.length < 15) {
      showValidation(ibanInput, "IBAN should be 15-24 characters", false);
    } else if (ibanInput.value.length >= 15 && ibanInput.value.length <= 24) {
      showValidation(ibanInput, "✓ Valid IBAN format", true);
    }
  } else {
    accountInput.disabled = codCheckbox.checked ? true : false;
    hideValidation(ibanInput);
  }
  validateForm();
});

codCheckbox.addEventListener("change", () => {
  const isChecked = codCheckbox.checked;
  if (isChecked) {
    accountInput.disabled = true;
    ibanInput.disabled = true;
    hideValidation(accountInput);
    hideValidation(ibanInput);
    // Remove payment method selection for COD
    paymentIcons.forEach(i => i.classList.remove('selected'));
    selectedPaymentMethod = null;
  } else {
    if (!ibanInput.value.trim()) accountInput.disabled = false;
    if (!accountInput.value.trim()) ibanInput.disabled = false;
  }
  validateForm();
});

function validateForm() {
  const accountValid = accountInput.value.trim().length >= 12 && accountInput.value.trim().length <= 16;
  const ibanValid = ibanInput.value.trim().length >= 15 && ibanInput.value.trim().length <= 24;
  const codChecked = codCheckbox.checked;
  const paymentMethodSelected = selectedPaymentMethod || codChecked;

  const isValid = (accountValid || ibanValid || codChecked) && paymentMethodSelected;

  let paymentType = "Unknown";
  if (codChecked) {
    paymentType = "Cash on Delivery";
  } else if (accountValid) {
    paymentType = `Online Payment - ${selectedPaymentMethod || 'Card'}`;
  } else if (ibanValid) {
    paymentType = `Online Payment - ${selectedPaymentMethod || 'Bank'}`;
  }
  localStorage.setItem("paymentType", paymentType);

  confirmBtn.disabled = !isValid;
  confirmBtn.style.pointerEvents = isValid ? "auto" : "none";
  confirmBtn.style.opacity = isValid ? "1" : "0.5";
  confirmBtn.style.cursor = isValid ? "pointer" : "not-allowed";
}

// Enhanced confirm button with loading state
confirmBtn.addEventListener('click', function(e) {
  if (!confirmBtn.disabled) {
    confirmBtn.classList.add('loading');
    confirmBtn.textContent = 'Processing...';
    
    // Simulate processing time
    setTimeout(() => {
      window.location.href = 'Invoice.html';
    }, 1500);
  }
});

validateForm();

function resetForm() {
  accountInput.value = "";
  ibanInput.value = "";
  codCheckbox.checked = false;
  selectedPaymentMethod = null;

  accountInput.disabled = false;
  ibanInput.disabled = false;
  
  hideValidation(accountInput);
  hideValidation(ibanInput);
  paymentIcons.forEach(i => i.classList.remove('selected'));
  
  confirmBtn.classList.remove('loading');
  confirmBtn.textContent = 'Confirm Order';

  validateForm();
}

window.addEventListener("load", resetForm);

window.addEventListener("pageshow", (event) => {
  if (event.persisted) {
    resetForm();
  }
});
    </script>  
  </body>
</html>
